aid: popsink
name: Popsink
description: >-
  Popsink is a real-time data replication and change data capture (CDC) platform
  that continuously moves data out of mission-critical and legacy systems into
  cloud data platforms with low latency and minimal production impact. It offers
  a broad catalog of source and target connectors (Postgres, MySQL, Oracle, MSSQL,
  MongoDB, Kafka, IBM Z / IBMi (AS/400), SAP, Salesforce, HubSpot, Snowflake,
  BigQuery, Databricks, ClickHouse, Iceberg, and more) and flexible deployment
  options spanning SaaS, bring-your-own-cloud, self-hosted Kubernetes, single-VM,
  on-premises, and air-gapped installs. Popsink exposes a public REST API and an
  on-prem control-plane REST API (OAuth2 password / JWT bearer, with SAML SSO) for
  managing pipelines, connectors, environments, teams, schemas, and transforms.
  Backed by Seedcamp.
