openapi: 3.2.0
info:
  title: Popsink public Organizations API
  description: Welcome to Popsink, your go-to SaaS solution for seamless programmatic interaction!
  version: 0.0.1
tags:
- name: Organizations
paths:
  /organizations/:
    get:
      tags:
      - Organizations
      summary: Get Organizations
      description: Get the organizations of the current user.
      operationId: get_organizations_organizations__get
      parameters:
      - required: false
        schema:
          title: Authorization
          type: string
          default: ''
        name: authorization
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Organizations
      summary: Create Organization
      description: Create an organization.
      operationId: create_organization_organizations__post
      parameters:
      - required: false
        schema:
          title: Authorization
          type: string
          default: ''
        name: authorization
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /organizations/{organization_uuid}/:
    get:
      tags:
      - Organizations
      summary: Get Organization
      description: Get a specific organization details.
      operationId: get_organization_organizations__organization_uuid___get
      parameters:
      - required: true
        schema:
          title: Organization Uuid
          type: string
        name: organization_uuid
        in: path
      - required: false
        schema:
          title: Authorization
          type: string
          default: ''
        name: authorization
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Organizations
      summary: Delete Organization
      description: Delete a specific organization.
      operationId: delete_organization_organizations__organization_uuid___delete
      parameters:
      - required: true
        schema:
          title: Organization Uuid
          type: string
        name: organization_uuid
        in: path
      - required: false
        schema:
          title: Authorization
          type: string
          default: ''
        name: authorization
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    OrganizationConfig:
      title: OrganizationConfig
      required:
      - name
      - region_label
      type: object
      properties:
        name:
          title: Name
          type: string
        region_label:
          title: Region Label
          type: string
      description: Define a message event, to send to Kafka.
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
