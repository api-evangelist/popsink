components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    KeyMoverConfig:
      properties:
        key:
          type: string
          title: Key
        key_path:
          type: string
          title: Key Path
      type: object
      required:
      - key
      - key_path
      title: KeyMoverConfig
      description: Config for KeyMover function.
    Body_job_smt_process_filtering_smt_process_filtering_post:
      properties:
        config:
          $ref: '#/components/schemas/FilteringConfiguration'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_filtering_smt_process_filtering_post
    Body_job_smt_process_hash_smt_process_hash_post:
      properties:
        config:
          $ref: '#/components/schemas/HashConfig'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_hash_smt_process_hash_post
    Body_job_smt_process_dict_mover_smt_process_dict_mover_post:
      properties:
        config:
          $ref: '#/components/schemas/KeysConfiguration'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_dict_mover_smt_process_dict_mover_post
    Body_job_smt_process_splitter_smt_process_splitter_post:
      properties:
        config:
          $ref: '#/components/schemas/SplitterConfiguration'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_splitter_smt_process_splitter_post
    KeysConfiguration:
      properties:
        keys:
          items:
            type: string
          type: array
          title: Keys
      type: object
      required:
      - keys
      title: KeysConfiguration
      description: Keys config.
    FilteringConfiguration:
      properties:
        operator:
          type: string
          enum:
          - EQUAL
          - IN
          - NOT_EQUAL
          - NOT_IN
          title: Operator
        key:
          type: string
          title: Key
        value:
          type: string
          title: Value
      type: object
      required:
      - operator
      - key
      - value
      title: FilteringConfiguration
      description: Filtering config.
    Body_job_smt_process_key_mover_smt_process_key_mover_post:
      properties:
        config:
          items:
            $ref: '#/components/schemas/KeyMoverConfig'
          type: array
          title: Config
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_key_mover_smt_process_key_mover_post
    Body_job_smt_process_stringify_key_smt_process_stringify_key_post:
      properties:
        config:
          $ref: '#/components/schemas/KeysConfiguration'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_stringify_key_smt_process_stringify_key_post
    HashConfig:
      properties:
        hash_type:
          type: string
          enum:
          - MD5
          - SHA-256
          - SHA-512
          title: Hash Type
        paths:
          items:
            type: string
          type: array
          title: Paths
      type: object
      required:
      - hash_type
      - paths
      title: HashConfig
      description: Hash key config.
    Body_job_smt_process_unenvelope_smt_process_unenvelope_post:
      properties:
        config:
          $ref: '#/components/schemas/KeyConfiguration'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_unenvelope_smt_process_unenvelope_post
    Body_job_smt_process_mapper_smt_process_mapper_post:
      properties:
        config:
          items:
            $ref: '#/components/schemas/MapperTableConfig'
          type: array
          title: Config
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_mapper_smt_process_mapper_post
    KeyConfiguration:
      properties:
        key:
          type: string
          title: Key
      type: object
      required:
      - key
      title: KeyConfiguration
      description: Key config.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MapperTableConfig:
      properties:
        table_name:
          type: string
          title: Table Name
        fields:
          items:
            $ref: '#/components/schemas/MapperColumnConfig'
          type: array
          title: Fields
      type: object
      required:
      - table_name
      - fields
      title: MapperTableConfig
      description: Mapper config.
    MapperColumnConfig:
      properties:
        key:
          type: string
          title: Key
        path:
          type: string
          title: Path
          default: ''
        static:
          type: string
          title: Static
          default: ''
        nullable:
          type: boolean
          title: Nullable
          default: true
      type: object
      required:
      - key
      title: MapperColumnConfig
      description: Mapper config part.
    Body_job_smt_process_encryption_smt_process_encryption_post:
      properties:
        config:
          $ref: '#/components/schemas/EncryptConfiguration'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_encryption_smt_process_encryption_post
    EncryptConfiguration:
      properties:
        encrypt_key:
          type: string
          title: Encrypt Key
        paths:
          items:
            type: string
          type: array
          title: Paths
      type: object
      required:
      - encrypt_key
      - paths
      title: EncryptConfiguration
      description: Encrypt config.
    SplitterConfiguration:
      properties:
        root_table_name:
          type: string
          title: Root Table Name
          default: root
        popsink_pk:
          type: string
          title: Popsink Pk
        pk:
          anyOf:
          - type: string
          - type: 'null'
          title: Pk
        abbreviate_len:
          anyOf:
          - type: integer
          - type: 'null'
          title: Abbreviate Len
      type: object
      title: SplitterConfiguration
      description: Splitter config.
    Body_job_smt_process_key_filter_smt_process_key_filter_post:
      properties:
        config:
          $ref: '#/components/schemas/KeysConfiguration'
        message:
          type: object
          title: Message
      type: object
      required:
      - config
      - message
      title: Body_job_smt_process_key_filter_smt_process_key_filter_post
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: auth/jwt/login
