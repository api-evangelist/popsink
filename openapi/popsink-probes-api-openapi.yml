openapi: 3.2.0
info:
  title: Fast Probes API
  version: 0.1.0
servers:
- url: /api
tags:
- name: Probes
paths:
  /livez:
    get:
      tags:
      - Probes
      summary: Probes:Livez
      description: Get the liveness probe.
      operationId: probes_livez_livez_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /readyz:
    get:
      tags:
      - Probes
      summary: Probes:Livez
      description: Get the readiness probe.
      operationId: probes_livez_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
components:
  schemas:
    HealthCheck:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthCheck
      description: Healthcheck pydantic model.
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: auth/jwt/login
